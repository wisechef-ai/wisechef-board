<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiseChef — Your Personal AI Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a; color: #e0e0e0;
            min-height: 100vh; display: flex;
            align-items: center; justify-content: center;
        }
        .container { max-width: 600px; width: 92%; padding: 20px; }
        .logo { text-align: center; margin-bottom: 2rem; }
        .logo span { font-size: 3.5rem; }
        .logo h1 {
            font-size: 2rem; font-weight: 700;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .logo .tagline { color: #888; font-size: 0.95rem; margin-top: 4px; }
        .logo .flavor { color: #555; font-size: 0.8rem; margin-top: 6px; font-style: italic; }
        .card {
            background: #161616; border: 1px solid #2a2a2a;
            border-radius: 16px; padding: 32px;
        }
        .progress { display: flex; gap: 6px; justify-content: center; margin-bottom: 24px; }
        .progress .dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #333; transition: background 0.3s;
        }
        .progress .dot.active { background: #f59e0b; }
        .progress .dot.done { background: #22c55e; }
        .step-title {
            font-size: 1.25rem; font-weight: 600; text-align: center;
            margin-bottom: 4px; color: #e0e0e0;
        }
        .step-sub {
            color: #666; text-align: center; font-size: 0.85rem; margin-bottom: 20px;
        }
        .field { margin-bottom: 16px; }
        .field label {
            display: block; font-size: 0.85rem; font-weight: 600;
            color: #bbb; margin-bottom: 6px;
        }
        .field .hint { font-size: 0.75rem; color: #555; margin-bottom: 6px; }
        .field input, .field textarea, .field select {
            width: 100%; padding: 12px 14px; border: 1px solid #333;
            border-radius: 10px; background: #0d0d0d; color: #fff;
            font-size: 0.95rem; outline: none; font-family: inherit;
            transition: border-color 0.2s;
        }
        .field input:focus, .field textarea:focus, .field select:focus { border-color: #f59e0b; }
        .field textarea { resize: vertical; min-height: 70px; }
        .field select option { background: #0d0d0d; }

        .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            padding: 8px 16px; border-radius: 20px; font-size: 0.85rem;
            border: 1px solid #333; background: #0d0d0d; color: #bbb;
            cursor: pointer; transition: all 0.2s; user-select: none;
        }
        .chip.selected { border-color: #f59e0b; background: #2a1f0a; color: #f59e0b; }
        .chip:hover { border-color: #555; }

        .buttons { display: flex; justify-content: space-between; margin-top: 24px; gap: 12px; }
        .btn {
            padding: 12px 24px; border-radius: 10px; font-size: 0.95rem;
            font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .btn-back { background: transparent; border: 1px solid #333; color: #999; }
        .btn-back:hover { border-color: #555; color: #ccc; }
        .btn-next {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            border: none; color: #fff; margin-left: auto;
        }
        .btn-next:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-next:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .error { color: #ef4444; font-size: 0.85rem; text-align: center; margin-top: 12px; }

        .preview-box {
            background: #0d0d0d; border: 1px solid #333; border-radius: 10px;
            padding: 16px; font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.8rem; line-height: 1.6; color: #a3a3a3;
            max-height: 400px; overflow-y: auto; white-space: pre-wrap;
        }
        .preview-box h3 { color: #f59e0b; font-size: 0.85rem; margin-bottom: 4px; font-family: inherit; }

        .done { text-align: center; padding: 40px 20px; }
        .done .emoji { font-size: 3rem; margin-bottom: 12px; }
        .done h2 { font-size: 1.5rem; margin-bottom: 8px; }
        .done p { color: #888; margin-bottom: 20px; }
        .done .btn-next { display: inline-block; text-decoration: none; }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <span>🍳</span>
            <h1>WiseChef</h1>
            <p class="tagline">Your personal AI assistant</p>
            <p class="flavor" id="flavor"></p>
        </div>

        <div class="card" id="wizard">
            <div class="progress" id="progress"></div>
            <div class="step-title" id="stepTitle"></div>
            <div class="step-sub" id="stepSub"></div>
            <div id="questions"></div>
            <div class="error hidden" id="error"></div>
            <div class="buttons">
                <button class="btn btn-back hidden" id="backBtn" onclick="prevStep()">← Back</button>
                <button class="btn btn-next" id="nextBtn" onclick="nextStep()">Next →</button>
            </div>
        </div>

        <div class="card done hidden" id="doneScreen">
            <div class="emoji">🎉</div>
            <h2>All set!</h2>
            <p>Your assistant is configured and ready to chat.</p>
            <a href="/" class="btn btn-next" id="chatBtn">Continue →</a>
        </div>
    </div>

    <script>
    const FLAVORS = [
        "Cooking up intelligence, one prompt at a time",
        "Your AI sous-chef for everything",
        "Less busywork, more brilliance",
        "Think of me as your second brain",
        "Automate the boring. Focus on the bold.",
        "I never sleep, and I never forget",
        "Making complexity taste simple",
        "Built different. Works harder.",
        "Powered by curiosity and a lot of neurons",
    ];
    document.getElementById('flavor').textContent = FLAVORS[Math.floor(Math.random() * FLAVORS.length)];

    const STEPS = [
        {
            title: "Who are you? 👋",
            subtitle: "Let's start with the basics",
            questions: [
                { id: 'name', label: 'Your name', type: 'text', placeholder: 'e.g. Anna Kowalska' },
                { id: 'role', label: 'Your role / title', type: 'text', placeholder: 'e.g. Founder, Marketing Lead, Developer' },
                { id: 'organisation', label: 'Organisation / company', type: 'text', placeholder: 'e.g. Acme Corp, freelance, personal use' },
                { id: 'activities', label: 'What does your day-to-day look like?', type: 'textarea', placeholder: 'Describe what you actually spend your time on…', hint: 'Think about recurring tasks, meetings, projects, responsibilities.' },
            ]
        },
        {
            title: "What are your goals? 🎯",
            subtitle: "Help your assistant understand what success looks like",
            questions: [
                { id: 'goals', label: 'What do you want your AI assistant to help with?', type: 'textarea', placeholder: 'e.g. managing tasks, drafting emails, tracking projects, research…' },
                { id: 'ideal_week', label: 'Describe your ideal productive week', type: 'textarea', placeholder: 'What would a perfect week look like if everything ran smoothly?', hint: 'Think about what you\'d love to spend MORE time on.' },
            ]
        },
        {
            title: "What slows you down? 🧱",
            subtitle: "Identify friction so your assistant can help eliminate it",
            questions: [
                { id: 'time_wasters', label: 'What eats up the most time in your day?', type: 'textarea', placeholder: 'e.g. context switching, manual data entry, chasing updates…' },
                { id: 'cracks', label: 'What tends to fall through the cracks?', type: 'textarea', placeholder: 'e.g. follow-ups, deadlines, small tasks that pile up…', hint: 'These are things your assistant should proactively track.' },
            ]
        },
        {
            title: "Communication style 💬",
            subtitle: "So your assistant matches your vibe",
            questions: [
                { id: 'style', label: 'Pick the style that fits you best', type: 'chips', options: ['Direct & concise', 'Warm & friendly', 'Technical & precise', 'Playful & casual'] },
                { id: 'reports', label: 'How do you prefer information delivered?', type: 'select', options: ['Bullet points — short & scannable', 'Detailed — I want context', 'TL;DR first, details if I ask', 'Tables and structured data'] },
                { id: 'language', label: 'Preferred language (for responses)', type: 'text', placeholder: 'e.g. English, Polish, mix of both' },
            ]
        },
        {
            title: "Integrations 📡",
            subtitle: "Channels and tools your assistant should know about",
            questions: [
                { id: 'channels', label: 'Which messaging platforms do you use?', type: 'chips', options: ['WhatsApp', 'Telegram', 'Discord', 'Signal', 'Slack', 'Email', 'Calendar', 'SMS'], multi: true },
                { id: 'primary_channel', label: 'Primary channel (where you want most messages)', type: 'text', placeholder: 'e.g. WhatsApp, Telegram' },
                { id: 'working_hours', label: 'Your working hours / timezone', type: 'text', placeholder: 'e.g. 9-18 CET, flexible, always on' },
            ]
        },
        {
            title: "Review & confirm ✅",
            subtitle: "Here's what your assistant will know about you",
            questions: [
                { id: '_preview', label: '', type: 'preview' },
            ]
        }
    ];

    let currentStep = 0;
    const answers = {};

    function generatePreview() {
        const s = answers;
        const style = s.style || 'flexible';
        const channels = (s.channels || []).join(', ') || 'not specified';
        return `# SOUL.md — ${s.name || 'Assistant'}'s WiseChef

## Identity
You are a personal AI assistant for **${s.name || '(name)'}**.
${s.name || 'They'} works as **${s.role || '(role)'}** at **${s.organisation || '(org)'}**.

## Daily Context
${s.activities || '(day-to-day activities)'}

## Goals & Priorities
${s.goals || '(goals)'}

### Ideal Week
${s.ideal_week || '(ideal week)'}

## Friction & Pain Points
### Time Wasters
${s.time_wasters || '(time wasters)'}

### Things That Fall Through Cracks
${s.cracks || '(items that slip)'}

## Communication Preferences
- **Style:** ${style}
- **Information format:** ${s.reports || 'concise'}
- **Language:** ${s.language || 'English'}
- When in doubt, be ${style.toLowerCase().includes('direct') ? 'brief and to the point' : style.toLowerCase().includes('warm') ? 'supportive and encouraging' : style.toLowerCase().includes('technical') ? 'precise with code examples' : 'light-hearted but helpful'}.

## Channels
- **Active:** ${channels}
- **Primary:** ${s.primary_channel || 'not set'}
- **Working hours:** ${s.working_hours || 'standard'}

## Operating Principles
- Be proactive — anticipate needs, don't wait to be asked
- Track commitments and follow up automatically
- Respect their time — no noise, no fluff
- Flag risks and blockers early
- Learn from patterns and adapt over time`;
    }

    function render() {
        const step = STEPS[currentStep];
        const isLast = currentStep === STEPS.length - 1;

        document.getElementById('progress').innerHTML = STEPS.map((_, i) =>
            `<div class="dot ${i < currentStep ? 'done' : i === currentStep ? 'active' : ''}"></div>`
        ).join('');

        document.getElementById('stepTitle').textContent = step.title;
        document.getElementById('stepSub').textContent = step.subtitle || `Step ${currentStep + 1} of ${STEPS.length}`;

        let html = '';
        for (const q of step.questions) {
            if (q.type === 'preview') {
                html += `<div class="preview-box">${escapeHtml(generatePreview())}</div>`;
                continue;
            }
            const val = answers[q.id] || '';
            html += `<div class="field">`;
            if (q.label) html += `<label>${q.label}</label>`;
            if (q.hint) html += `<div class="hint">${q.hint}</div>`;

            if (q.type === 'textarea') {
                html += `<textarea id="q_${q.id}" oninput="onInput('${q.id}', this.value)" placeholder="${q.placeholder || ''}">${val}</textarea>`;
            } else if (q.type === 'select') {
                const opts = q.options.map(o => `<option value="${o}" ${val === o ? 'selected' : ''}>${o}</option>`).join('');
                html += `<select id="q_${q.id}" onchange="onInput('${q.id}', this.value)"><option value="">Choose...</option>${opts}</select>`;
            } else if (q.type === 'chips') {
                const selected = q.multi ? (answers[q.id] || []) : [answers[q.id] || ''];
                html += `<div class="chip-group">`;
                for (const opt of q.options) {
                    const isSel = selected.includes(opt);
                    html += `<div class="chip ${isSel ? 'selected' : ''}" onclick="toggleChip('${q.id}', '${opt}', ${!!q.multi})">${opt}</div>`;
                }
                html += `</div>`;
            } else {
                html += `<input type="text" id="q_${q.id}" value="${val}" oninput="onInput('${q.id}', this.value)" placeholder="${q.placeholder || ''}">`;
            }
            html += `</div>`;
        }
        document.getElementById('questions').innerHTML = html;

        document.getElementById('backBtn').classList.toggle('hidden', currentStep === 0);
        document.getElementById('nextBtn').textContent = isLast ? '🚀 Launch Assistant' : 'Next →';
        updateNextBtn();
    }

    function escapeHtml(text) {
        return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
    }

    function toggleChip(id, value, multi) {
        if (multi) {
            const arr = answers[id] || [];
            const idx = arr.indexOf(value);
            if (idx >= 0) arr.splice(idx, 1); else arr.push(value);
            answers[id] = arr;
        } else {
            answers[id] = answers[id] === value ? '' : value;
        }
        render();
    }

    function onInput(id, value) {
        answers[id] = value;
        updateNextBtn();
    }

    function updateNextBtn() {
        const step = STEPS[currentStep];
        const required = step.questions.filter(q => q.type !== 'preview' && q.id !== 'language' && q.id !== 'working_hours');
        const allFilled = required.every(q => {
            const v = answers[q.id];
            if (Array.isArray(v)) return v.length > 0;
            return (v || '').toString().trim().length > 0;
        });
        document.getElementById('nextBtn').disabled = !allFilled;
    }

    function prevStep() {
        if (currentStep > 0) { currentStep--; render(); }
    }

    async function nextStep() {
        const isLast = currentStep === STEPS.length - 1;
        if (!isLast) { currentStep++; render(); return; }

        const btn = document.getElementById('nextBtn');
        const errEl = document.getElementById('error');
        btn.disabled = true;
        btn.textContent = 'Saving...';
        errEl.classList.add('hidden');

        try {
            const res = await fetch('/api/onboarding/complete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ answers })
            });
            if (!res.ok) throw new Error('Save failed');
            document.getElementById('wizard').classList.add('hidden');
            document.getElementById('doneScreen').classList.remove('hidden');
        } catch (e) {
            errEl.textContent = 'Failed to save. Please try again.';
            errEl.classList.remove('hidden');
            btn.disabled = false;
            btn.textContent = '🚀 Launch Assistant';
        }
    }

    fetch('/api/onboarding/status')
        .then(r => r.json())
        .then(d => { if (d.onboarded) window.location.href = '/'; else render(); })
        .catch(() => render());
    </script>
</body>
</html>
