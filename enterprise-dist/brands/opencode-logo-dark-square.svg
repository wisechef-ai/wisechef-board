<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="300" rx="40" fill="#18181b"/>
  <!-- Chef hat shape -->
  <g transform="translate(60, 50)">
    <ellipse cx="90" cy="80" rx="80" ry="60" fill="white" opacity="0.95"/>
    <ellipse cx="30" cy="100" rx="35" ry="35" fill="white" opacity="0.9"/>
    <ellipse cx="150" cy="100" rx="35" ry="35" fill="white" opacity="0.9"/>
    <rect x="20" y="120" width="140" height="60" rx="5" fill="white"/>
    <!-- Vertical lines on hat band -->
    <line x1="60" y1="120" x2="60" y2="180" stroke="#18181b" stroke-width="3" opacity="0.15"/>
    <line x1="90" y1="120" x2="90" y2="180" stroke="#18181b" stroke-width="3" opacity="0.15"/>
    <line x1="120" y1="120" x2="120" y2="180" stroke="#18181b" stroke-width="3" opacity="0.15"/>
  </g>
  <!-- W letter -->
  <text x="150" y="255" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="48" fill="white" letter-spacing="4">WISECHEF</text>
</svg>
