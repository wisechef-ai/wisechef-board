name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - development
      - main
      - master

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install --production=false
          fi

      - name: Lint (if present)
        run: npm run lint --if-present

      - name: Build
        run: npm run build

  deploy-dev:
    name: Deploy → dev.wisechef.ai
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature/agent-type-selector'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to dev VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_VPS_IP }}
          username: wisechef
          key: ${{ secrets.DEV_VPS_SSH_KEY }}
          timeout: 120s
          script: |
            set -euo pipefail
            cd /opt/wisechef/board
            git fetch origin
            git checkout feature/agent-type-selector
            git pull origin feature/agent-type-selector
            if [[ -f package-lock.json ]]; then
              npm ci
            else
              npm install --production=false
            fi
            npm run build
            sudo systemctl restart wisechef-board
            sleep 2
            systemctl is-active wisechef-board
            echo "Deployed feature/agent-type-selector to dev.wisechef.ai"
